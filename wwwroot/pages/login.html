<div class="login-page-bg d-flex align-items-center jusity-content-center p-3">
    <div class="login-card-website p-4 p-md-5 mx-auto" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <img src="assets/images/DotActiv-Logo cropped.png" alt="DotActiv Logo" class="brand-logo mb-3" style="max-height: 150px;">
            <h4 class="fw-bold" style="color: var(--da-navy-dark);">Store Dashboard</h4>
            <p class="small" style="color: var(--da-navy)">Please sign in with your manager credentials</p>
        </div>

        <div class="da-error-banner" ng-if="errorMessage">
            <i class="bi bi-exclamation-circle-fill error-icon-circle"></i>
            <div>{{ errorMessage }}</div>
        </div>
         
        <form ng-submit="submitLogin()" novalidate>
            <div class="form-floating-da">
                <label for="username" class="form-label-da">Username <span class="req=start" style="var(--da-accent-red)">*</span></label>
                <input type="text" id="username" class="input-underline" ng-model="credentials.username" required autofocus>
            </div>

            <div class="form-floating-da">
                <label for="password" class="form-label-da" >Password <span class="req=start">*</span></label>
                <input type="password" id="password" class="input-underline" ng-model="credentials.password" required>
            </div>

            <button type="submit" class="btn btn-da w-100 py-2 shadow-sm" ng-disabled="isLoading || !credentials.username || !credentials.password">
                <span ng-if="!isLoading">Sign In</span>
                <span ng-if="isLoading">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Authenticating...
                </span>
            </button>
        </form>
    </div>
</div>
